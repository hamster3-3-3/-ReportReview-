<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>日周報繳交統計</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#fff;
      --line:#e5e7eb;
      --text:#111827;
      --muted:#6b7280;
      --accent:#2563eb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    h1{margin:0 0 16px;font-size:28px}
    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 20px}
    button{
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
    }
    button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .status{
      padding:10px 12px;
      border-radius:10px;
      background:#eff6ff;
      color:#1d4ed8;
      border:1px solid #bfdbfe;
    }
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:18px;
      box-shadow:0 4px 16px rgba(0,0,0,.04);
    }
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
    .title{font-size:20px;font-weight:700;margin:0}
    .open-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border-radius:10px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--accent);
      text-decoration:none;
      font-weight:700;
      white-space:nowrap;
    }
    .open-link:hover{background:#eff6ff}
    .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
    .pill{border:1px solid var(--line);border-radius:12px;padding:12px;min-height:90px}
    .pill .label{font-size:12px;color:var(--muted);margin-bottom:6px}
    .pill .val{font-size:24px;font-weight:700}
    .info-block{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
    .info-block .label{font-size:12px;color:var(--muted);margin-bottom:6px}
    .info-block .val{font-size:15px;line-height:1.5;word-break:break-word}
    details{border-top:1px solid var(--line);padding-top:12px}
    summary{cursor:pointer;font-weight:700}
    ul{margin:10px 0 0 18px;padding:0;max-height:240px;overflow:auto}
    li{margin:6px 0;word-break:break-all}
    .muted{color:var(--muted)}
    code{background:#f3f4f6;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>日周報繳交統計</h1>

    <div class="toolbar">
      <button class="primary" id="reloadBtn">重新讀取</button>
      <div class="status" id="status">尚未讀取資料</div>
    </div>

    <div id="cards" class="grid"></div>
  </div>

  <script>
    const STATUS = document.getElementById('status');
    const CARDS = document.getElementById('cards');
    const SOURCE = './data/counts.json';

    function esc(s){
      return String(s ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;');
    }

    function getLastFileName(item){
      return item?.lastFileName || '';
    }

    function getUploadTime(item){
      return item?.lastUploadedAt || item?.uploadedAt || item?.lastModified || item?.modifiedTime || item?.lastModifiedTime || '';
    }

    const FOLDER_LINKS = {
      mgmt: 'https://tfmmvlsfamilycom.sharepoint.com/sites/msteams_6e232e/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2Fmsteams%5F6e232e%2FShared%20Documents%2F%E6%99%89%E6%AC%A3%E5%BB%A0%2F%E6%99%89%E6%AC%A3%2D%E3%80%90JFM%E6%8C%87%E5%B0%8E%E3%80%91%E7%94%9F%E7%94%A2%E7%AE%A1%E7%90%86%E5%A0%B1%E8%A1%A8%2F115&viewid=9e47012e%2D882f%2D4bb1%2D9679%2D95296816f1dc',
      daily: 'https://tfmmvlsfamilycom.sharepoint.com/sites/msteams_6e232e/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2Fmsteams%5F6e232e%2FShared%20Documents%2F%E6%99%89%E6%AC%A3%E5%BB%A0%2F%E6%99%89%E6%AC%A3%E7%B5%84%E5%90%88%2D%E7%94%9F%E7%94%A2%E6%97%A5%E5%A0%B1%28114%E5%B9%B4%E4%B8%83%E6%9C%88%E8%B5%B7%29%2F115&viewid=9e47012e%2D882f%2D4bb1%2D9679%2D95296816f1dc',
      semi: 'https://tfmmvlsfamilycom.sharepoint.com/sites/msteams_6e232e/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2Fmsteams%5F6e232e%2FShared%20Documents%2F%E6%99%89%E6%AC%A3%E5%BB%A0%2F%E6%99%89%E6%AC%A3%2D%E5%8D%8A%E6%88%90%E5%93%81%E7%AE%A1%E7%90%86%E6%97%A5%E5%A0%B1%28114%E5%B9%B4%E4%B8%83%E6%9C%88%E8%B5%B7%29%2F115&viewid=9e47012e%2D882f%2D4bb1%2D9679%2D95296816f1dc'
    };

    function render(data){
      const updatedAt = data?.updatedAt ?? '未知';
      const items = Array.isArray(data?.items) ? data.items : [];
      STATUS.textContent = `已讀取：${updatedAt}`;

      if (!items.length) {
        CARDS.innerHTML = '<section class="card"><div class="muted">目前沒有可顯示的資料。</div></section>';
        return;
      }

      CARDS.innerHTML = items.map(item => {
        const files = Array.isArray(item?.files) ? item.files : [];
        const lastFileName = getLastFileName(item);
        const uploadTime = getUploadTime(item);
        const folderLink = FOLDER_LINKS[item?.key] || '';

        return `
          <section class="card">
            <div class="card-head">
              <h2 class="title">${esc(item?.title || '')}</h2>
              ${folderLink ? `<a class="open-link" href="${folderLink}" target="_blank" rel="noopener noreferrer">打開檔案位置</a>` : ''}
            </div>

            <div class="meta">
              <div class="pill">
                <div class="label">當層檔案數</div>
                <div class="val">${Number(item?.count ?? 0)}</div>
              </div>
              <div class="pill">
                <div class="label">最近上傳時間</div>
                <div class="val" style="font-size:16px;line-height:1.4;word-break:break-word;">${uploadTime ? esc(uploadTime) : '—'}</div>
              </div>
            </div>

            <div class="info-block">
              <div class="label">最近檔案</div>
              <div class="val">${lastFileName ? esc(lastFileName) : '—'}</div>
            </div>

            <details>
              <summary>檔名清單（${files.length}）</summary>
              ${files.length
                ? `<ul>${files.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`
                : `<div class="muted" style="margin-top:10px;">沒有檔案</div>`}
            </details>
          </section>
        `;
      }).join('');
    }

    async function loadData(){
      STATUS.textContent = '讀取中...';
      try{
        const res = await fetch(SOURCE + '?t=' + Date.now(), { cache:'no-store' });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(data);
      }catch(err){
        STATUS.textContent = '讀取失敗';
        CARDS.innerHTML = `<section class="card"><div class="muted">無法讀取 <code>${esc(SOURCE)}</code><br>${esc(err.message)}</div></section>`;
      }
    }

    document.getElementById('reloadBtn').addEventListener('click', loadData);
    loadData();
  </script>
</body>
</html>
